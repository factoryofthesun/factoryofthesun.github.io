# Invited talks, rendered on the homepage "talks" section via _includes/talks.liquid.
# Each entry:
#   title        - the talk title (shown in bold)
#   event        - the venue / series (shown in italics)
#   institution  - where it was given
#   year         - shown in the year badge on the left, and in the date line
#   month        - optional; shown in the date line (e.g. July). Leave blank to show year only.
#   day          - optional; shown in the date line (needs month too, e.g. 8)
#   comments     - optional note shown below the date in standard font
#   preview      - optional; filename inside assets/img/presentation_preview/. Shows an
#                  embedded video if a YouTube recording exists, else this image linking
#                  to the slides PDF.
#   linkitems    - optional buttons (e.g. Recording, Slides). Leave `link:` blank
#                  to hide that button until you have a URL.

